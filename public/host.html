<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maut Ka Mahurat · Host</title>
    <meta name="theme-color" content="#140820" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f4c95d' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='9.5' width='18' height='11.5' rx='1.6'/><path d='M3.4 9.2 19.8 4.6l1 3.6L4.4 12.8'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&family=Permanent+Marker&family=Rozha+One&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/theme.css" />
    <link rel="stylesheet" href="/css/cinema.css" />
    <link rel="stylesheet" href="/css/host.css" />
  </head>
  <body class="host">
    <!-- atmosphere (back to front) -->
    <div id="skyMount"></div>
    <div class="candlelight"></div>
    <canvas id="fx" class="fx-canvas" aria-hidden="true"></canvas>

    <div class="host-shell">
      <header class="topbar" id="topbar" hidden>
        <div class="brand-mini display gold-text">Maut Ka Mahurat</div>
        <div class="room-pill" id="roomPill">
          <span>Join at <b id="joinUrl">…</b></span>
          <span class="room-pill__sep"></span>
          <span>Code <b class="room-pill__code" id="roomCode">····</b></span>
        </div>
        <div class="topbar__controls">
          <button class="icon-btn" id="muteBtn" title="Mute (M)" aria-label="Mute"></button>
          <button class="icon-btn" id="fsBtn" title="Fullscreen (F)" aria-label="Fullscreen"></button>
        </div>
      </header>

      <main class="stage" id="stage" aria-live="polite"></main>

      <div class="subtitles" id="subtitles" aria-live="polite"></div>
      <footer class="cast" id="cast"></footer>
    </div>

    <div class="diya-row" id="diyaRow" aria-hidden="true"></div>
    <div class="letterbox" aria-hidden="true"></div>
    <div class="burn" id="burn" aria-hidden="true"></div>
    <div id="projectorMount"></div>
    <div id="curtainMount"></div>
    <div class="toast" id="toast" hidden></div>
    <div class="grain"></div>
    <div class="vignette"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/art.js"></script>
    <script src="/js/shared.js"></script>
    <script src="/js/narration.js"></script>
    <script src="/js/audio.js"></script>
    <script src="/host.js"></script>
  </body>
</html>
